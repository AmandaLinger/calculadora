<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="visor">0</div>
        <div class="container_buttons">
            <button id="btn_ce" onclick="limpaVisor()">CE</button>
            <button onclick="limpaUltimoElemento()">C</button>
            <button onclick="escreveNoVisor('%')">%</button>
            <button onclick="escreveNoVisor('÷')" id="operador_estilizado">÷</button>
            <button onclick="escreveNoVisor('7')">7</button>
            <button onclick="escreveNoVisor('8')">8</button>
            <button onclick="escreveNoVisor('9')">9</button>
            <button onclick="escreveNoVisor('*')" id="operador_estilizado">x</button>
            <button onclick="escreveNoVisor('4')">4</button>
            <button onclick="escreveNoVisor('5')">5</button>
            <button onclick="escreveNoVisor('6')">6</button>
            <button onclick="escreveNoVisor('-')" id="operador_estilizado">-</button>
            <button onclick="escreveNoVisor('1')">1</button>
            <button onclick="escreveNoVisor('2')">2</button>
            <button onclick="escreveNoVisor('3')">3</button>
            <button onclick="escreveNoVisor('+')" id="operador_estilizado">+</button>
            <button onclick="multiplicaMenosUm()">±</button>
            <button onclick="escreveNoVisor('0')">0</button>
            <button onclick="escreveNoVisor('.')">,</button>
            <button onclick="fazCalculo()" id="operador_igualdade">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
